name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (swift build + swift test)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: iOS Simulator (xcodebuild test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: |
          xcodebuild test \
            -scheme WidgetDevelopmentKit \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -skipPackagePluginValidation

  docs:
    name: DocC
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -scheme WidgetDevelopmentKit \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/docbuild
