# XcodeGen spec for WidgetKitExample.xcodeproj. The generated project is committed, so
# XcodeGen is only needed after changing this file: `xcodegen generate` in this folder.
name: WidgetKitExample
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sign to run locally, so the app runs in the simulator without a team.
    # Set your team and App Group to run on a device.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  WidgetDevelopmentKit:
    path: ../..
targets:
  WidgetKitExample:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: WidgetDevelopmentKit
        product: WidgetDevelopmentKit
      - target: WidgetKitExampleWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Widget Kit Example
        UILaunchScreen: {}
        WidgetDevelopmentKitAppGroup: group.com.example.widgets
    entitlements:
      path: App/WidgetKitExample.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WidgetKitExample
  WidgetKitExampleWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: WidgetDevelopmentKit
        product: WidgetDevelopmentKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Widget Kit Example
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        WidgetDevelopmentKitAppGroup: group.com.example.widgets
    entitlements:
      path: Widgets/WidgetKitExampleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WidgetKitExample.Widgets
schemes:
  WidgetKitExample:
    build:
      targets:
        WidgetKitExample: all
        WidgetKitExampleWidgets: all
    run:
      config: Debug
